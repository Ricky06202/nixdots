background {
    monitor =
    path = ~/.cache/hypr/wallpaper.jpg
    color = rgba(000000ee)
    blur_passes = 2
    blur_size = 8
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(33ccffee)
    inner_color = rgba(00000088)
    font_color = ffffff
    fade_on_empty = true
    placeholder_text = <i>Contraseña</i>
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff0000ee)
    position = 0, -100
    halign = center
    valign = center
}
