# MangoHUD config — optimizado para portátil con NVIDIA 940M
# Limitar FPS reduce calor y mantien fluido

# FPS limit (30 para juegos pesados, 60 para ligeros)
fps_limit=30,0

# Ocultar overlay (el limite de FPS sigue activo) — Shift_R+F4 para mostrarlo
no_display

# Overlay
position=top-left
font_size=24
background_alpha=0.4
background_color=1a1a2e

# Métricas
gpu_stats
gpu_temp
gpu_power
cpu_stats
cpu_temp
ram
vram
engine_version
frametime=0
frame_timing

# Colores
gpu_color=2e86de
cpu_color=a55eea
ram_color=ff6b6b
vram_color=feca57
engine_version_color=1dd1a1
